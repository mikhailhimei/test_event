<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Response Match Panel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Response Match</h1>
      <p>Отлавливайте отправляемые JSON-запросы и сравнивайте значения по путям.</p>
    </header>

    <nav class="tabs" aria-label="Вкладки">
      <button class="tab active" data-tab="search" type="button">Поиск</button>
      <button class="tab" data-tab="history" type="button">История</button>
    </nav>

    <main>
      <section id="searchTab" class="tab-panel active">
        <div class="card">
          <label class="field">
            <span>Путь запроса</span>
            <input id="requestPath" type="text" placeholder="/api/events или часть URL" />
          </label>
          <p class="hint">Расширение проверяет тело отправляемых запросов, URL которых содержит этот путь.</p>
        </div>

        <div class="card">
          <div class="card-title-row">
            <h2>Сценарии</h2>
            <button id="addScenario" class="secondary" type="button">Добавить сценарий</button>
          </div>
          <div id="scenarios" class="scenarios"></div>
        </div>

        <div class="actions">
          <button id="saveSettings" type="button">Сохранить</button>
          <button id="clearMatches" class="secondary" type="button">Очистить поиск</button>
        </div>

        <label class="toggle card">
          <input id="blockExternal" type="checkbox" />
          <span>Блокировать переход на сторонние ресурсы</span>
        </label>

        <section class="card">
          <h2>Найденные совпадения</h2>
          <div id="matches" class="list empty">Совпадений пока нет.</div>
        </section>
      </section>

      <section id="historyTab" class="tab-panel">
        <div class="actions top-actions">
          <button id="clearHistory" class="danger" type="button">Удалить историю</button>
        </div>
        <section class="card">
          <h2>История совпадений</h2>
          <div id="history" class="list empty">История пуста.</div>
        </section>
      </section>
    </main>

    <template id="scenarioTemplate">
      <button class="scenario-card" type="button">
        <span class="scenario-card-name">Сценарий</span>
        <span class="scenario-card-meta">0 правил</span>
      </button>
    </template>

    <div id="scenarioModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="scenarioModalTitle">
        <form id="scenarioForm">
          <div class="modal-header">
            <h2 id="scenarioModalTitle">Добавить сценарий</h2>
            <button class="icon modal-close" type="button" title="Закрыть" data-close-scenario-modal>×</button>
          </div>

          <label class="field">
            <span>Название сценария</span>
            <input id="modalScenarioName" type="text" placeholder="Сценарий" />
          </label>

          <div class="modal-rules-header">
            <h3>Правила</h3>
            <button id="modalAddRule" class="secondary" type="button">Добавить правило</button>
          </div>
          <div id="modalScenarioRules" class="scenario-rules modal-rules"></div>

          <div class="modal-actions">
            <button id="modalDeleteScenario" class="danger" type="button" hidden>Удалить</button>
            <span class="modal-actions-spacer"></span>
            <button class="secondary" type="button" data-close-scenario-modal>Отмена</button>
            <button id="modalSaveScenario" type="submit">Сохранить сценарий</button>
          </div>
        </form>
      </div>
    </div>

    <template id="ruleTemplate">
      <div class="rule">
        <label class="field compact">
          <span>Путь ключа</span>
          <input class="rule-path" type="text" placeholder="extra_data.visual_object.id" />
        </label>
        <label class="field compact">
          <span>Сравнение</span>
          <select class="rule-mode">
            <option value="strict">Строгое</option>
            <option value="loose">Не строгое</option>
            <option value="exists">Должно быть</option>
          </select>
        </label>
        <label class="field compact">
          <span>Значение</span>
          <input class="rule-value" type="text" placeholder="auth_click, a|b,c или пусто для «должно быть»" />
        </label>
        <label class="rule-required">
          <input class="rule-required-input" type="checkbox" />
          <span>100% обязательно</span>
        </label>
        <button class="icon remove-rule" type="button" title="Удалить правило">×</button>
      </div>
    </template>

    <script src="./sidepanel.js" type="text/javascript"></script>
  </body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Traffic Check</title><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>Mobile Traffic Check</h1><p>Проверка мобильного трафика</p></div><span id="proxyStatus">Проверка proxy...</span></header><div class="menu"><button id="burgerButton" class="burger">☰ Меню</button><nav id="tabs" class="tabs"><button class="tab active" data-tab="search">Поиск</button><button class="tab" data-tab="scenarios">Сценарии</button><button class="tab" data-tab="common">Общие элементы</button><button class="tab" data-tab="settings">Настройки</button></nav></div><main><section id="searchTab" class="tab-panel active"><div class="card"><div class="title-row"><h2>Найденные совпадения</h2><button id="clearMatches" class="secondary">Очистить поиск</button></div><div id="matches" class="list empty">Совпадений пока нет.</div></div></section><section id="scenariosTab" class="tab-panel"><div class="card"><div class="title-row"><h2>Сценарии</h2><button id="addScenario">Добавить сценарий</button></div><div id="scenarios"></div><button id="deleteAllScenarios" class="secondary danger-text">Удалить все</button></div></section><section id="commonTab" class="tab-panel"><div class="card"><div class="title-row"><h2>Общие элементы</h2><button id="addCommonElement">Добавить общий элемент</button></div><p class="hint">Набор правил, который можно подключить к сценарию.</p><div id="commonElements"></div><button id="deleteAllCommonElements" class="secondary danger-text">Удалить все</button></div></section><section id="settingsTab" class="tab-panel"><div class="card"><label class="field"><span>Путь запроса</span><input id="requestPath" placeholder="/api/events или часть URL"></label><p class="hint">Пустое поле принимает запросы с любым URL.</p><div class="actions"><button id="downloadScenarios" class="secondary">Скачать сценарии</button><button id="uploadScenarios" class="secondary">Загрузить сценарии JSON</button></div><textarea id="scenariosJson" rows="6" placeholder='{"scenarios":[]}'></textarea><p id="settingsMessage" class="hint"></p></div></section></main><div id="scenarioModal" class="modal-backdrop" hidden><div class="modal"><form id="scenarioForm"><div class="modal-header"><h2 id="scenarioModalTitle">Сценарий</h2><button type="button" class="secondary" data-close>×</button></div><label class="field"><span>Название</span><input id="modalScenarioName"></label><label class="field"><span>Общие элементы</span><select id="modalCommonElement" multiple size="4"></select></label><label class="field"><span>Описание</span><textarea id="modalScenarioDescription" rows="2"></textarea></label><div class="title-row"><h3>Правила</h3><button id="modalAddRule" type="button" class="secondary">Добавить правило</button></div><div id="modalScenarioRules"></div><div class="modal-actions"><button id="modalDeleteScenario" type="button" class="danger">Удалить</button><button type="button" class="secondary" data-close>Отмена</button><button>Сохранить</button></div></form></div></div><div id="commonElementModal" class="modal-backdrop" hidden><div class="modal"><form id="commonElementForm"><div class="modal-header"><h2>Общий элемент</h2><button type="button" class="secondary" data-close-common>×</button></div><label class="field"><span>Название</span><input id="modalCommonElementName"></label><div class="title-row"><h3>Правила</h3><button id="modalAddCommonRule" type="button" class="secondary">Добавить правило</button></div><div id="modalCommonRules"></div><div class="modal-actions"><button id="modalDeleteCommon" type="button" class="danger">Удалить</button><button type="button" class="secondary" data-close-common>Отмена</button><button>Сохранить</button></div></form></div></div><template id="scenarioCardTemplate"><button class="scenario-card"><span class="scenario-card-name"></span><span class="scenario-card-meta"></span></button></template><template id="ruleTemplate"><div class="rule"><label class="field"><span>Путь ключа</span><input class="rule-path" placeholder="event.name"></label><label class="field"><span>Сравнение</span><select class="rule-mode"><option value="strict">Строгое</option><option value="loose">Не строгое</option><option value="exists">Должно быть</option></select></label><label class="field"><span>Значение</span><input class="rule-value" placeholder="auth_click"></label><label class="check"><input class="rule-show" type="checkbox"> В поиске</label><button type="button" class="secondary remove-rule">Удалить</button></div></template><script src="/eel.js"></script><script src="app.js"></script></body></html>
